<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <!-- Outer circle -->
  <circle cx="40" cy="40" r="38" stroke="#2d6a4f" stroke-width="2" fill="none" opacity="0.6"/>
  
  <!-- Inner circle -->
  <circle cx="40" cy="40" r="32" fill="#1b4332" opacity="0.9"/>
  
  <!-- Mountain silhouette (big peak center) -->
  <polygon points="40,12 62,52 18,52" fill="#52b788" opacity="0.9"/>
  
  <!-- Mountain silhouette (smaller left peak) -->
  <polygon points="24,38 38,18 52,38" fill="#2d6a4f"/>
  
  <!-- Snow cap on main peak -->
  <polygon points="40,12 46,26 34,26" fill="white" opacity="0.85"/>
  
  <!-- Ground / base line -->
  <rect x="16" y="52" width="48" height="4" rx="2" fill="#1b4332"/>

  <!-- Pine trees (left) -->
  <polygon points="22,52 25,43 28,52" fill="#40916c"/>
  <polygon points="19,52 22,46 25,52" fill="#2d6a4f"/>

  <!-- Pine trees (right) -->
  <polygon points="52,52 55,43 58,52" fill="#40916c"/>
  <polygon points="55,52 58,46 61,52" fill="#2d6a4f"/>

  <!-- Sun / moon (top right) -->
  <circle cx="58" cy="22" r="5" fill="#d4a017" opacity="0.8"/>
  
  <!-- Stars -->
  <circle cx="20" cy="20" r="1.2" fill="#f0c040" opacity="0.7"/>
  <circle cx="27" cy="15" r="0.9" fill="#f0c040" opacity="0.5"/>
  <circle cx="15" cy="30" r="0.8" fill="#f0c040" opacity="0.5"/>

  <!-- Bottom text arc area -->
  <path d="M 12 60 A 28 28 0 0 0 68 60" fill="#0d2a1a" opacity="0.5"/>
  
  <!-- Letter M stylized at bottom -->
  <text x="40" y="70" text-anchor="middle" font-family="'Bebas Neue', sans-serif" font-size="9" fill="#d4a017" letter-spacing="3" opacity="0.9">MAPALA</text>
</svg>
